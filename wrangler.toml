name = "icp-gershon-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Custom domain icp.gershon.ai (gershon.ai zone is on Cloudflare)
routes = [
  { pattern = "icp.gershon.ai", custom_domain = true }
]

# Workers AI — no external API key (Gershon "Intelligence" standard)
[ai]
binding = "AI"

# KV for reports, sessions and the team password hash.
# No id: Wrangler provisions the namespace automatically on first deploy (Workers Builds).
[[kv_namespaces]]
binding = "STORE"
