<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICP by Gershon.AI — App</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 64 64' aria-hidden='true'><defs><linearGradient id='icpg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%233b5bfd'/><stop offset='.5' stop-color='%236366f1'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect x='2' y='2' width='60' height='60' rx='18' fill='url(%23icpg)'/><circle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-opacity='.55' stroke-width='3'/><circle cx='32' cy='32' r='9.5' fill='none' stroke='%23fff' stroke-opacity='.85' stroke-width='3'/><circle cx='32' cy='32' r='3.6' fill='%23fff'/><path d='M32 32 L49 15' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/><path d='M44 14 h6 v6' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#0b1020; --bg2:#0e1530; --paper:#ffffff; --app:#f6f8fc;
  --text:#1a2133; --muted:#5b6478; --line:#e6e9f2; --soft:#f5f7fc;
  --brand:#3b5bfd; --brand2:#22d3ee; --brand-ink:#1e34c4; --brand-light:#eef2ff;
  --grad:linear-gradient(120deg,#3b5bfd 0%,#6366f1 45%,#22d3ee 100%);
  --ok:#16a34a; --warn:#b76b00; --err:#cc1016;
  --shadow:0 18px 50px rgba(18,28,64,.14); --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;font-size:.95rem;padding:.75rem 1.2rem;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.18s;white-space:nowrap;background:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(59,91,253,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(59,91,253,.45)}
.btn-primary:disabled{opacity:.6;transform:none;cursor:progress}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:#c8cfe6;background:var(--soft)}
.btn-ghost:disabled{opacity:.5;cursor:default}
.btn-lite{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.btn-lite:hover{background:rgba(255,255,255,.16)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
.brand small{display:block;font-weight:600;font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:-2px}
.mark{width:30px;height:30px;flex:none}

body{background:var(--app);font-size:14.5px}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sidebar .brand{padding:4px 8px 16px}
.newbtn{width:100%;margin-bottom:8px}
.nav-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hist button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500;transition:background .15s,color .15s}
.hist button:hover{background:var(--brand-light);color:var(--brand-ink)}
.hist button[aria-current="true"]{background:var(--brand);color:#fff}
.hist button[aria-current="true"] small{color:#dfe5ff}
.hist small{color:var(--muted);font-size:12px;flex:none}
.hist .hint{padding:8px 10px}
.spacer{flex:1}
.side-foot{border-top:1px solid var(--line);padding:12px 10px 4px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.side-foot a:hover{color:var(--brand-ink)}
.topbar{position:sticky;top:0;z-index:10;height:64px;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}
.topbar h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}
.top-actions .btn{padding:.55rem .95rem;font-size:.88rem;border-radius:10px}
.content{padding:28px;max-width:1180px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
label span{font-weight:400;color:var(--muted)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(59,91,253,.12)}
textarea{min-height:110px;resize:vertical}
.err{color:var(--err);font-size:13.5px;margin-top:10px}
.newgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px}
@media(max-width:980px){.newgrid{grid-template-columns:1fr}}
.hero-panel{background:radial-gradient(700px 300px at 90% -20%,#1b2a63 0,transparent 60%),linear-gradient(180deg,#0b1020,#0e1734);color:#eaf0ff;border:0}
.hero-panel h2{margin:0;font-size:1.6rem;letter-spacing:-.02em;color:#fff}
.hero-panel p{color:#c3ccea;margin:.5rem 0 0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.chip{display:flex;gap:10px;align-items:center;background:rgba(120,150,255,.1);border:1px solid rgba(140,165,255,.22);border-radius:10px;padding:8px 10px;font-size:.86rem;color:#dbe3ff}
.chip b{font-size:.75rem;color:var(--brand2);min-width:18px}
.go{width:100%;margin-top:20px;padding:.9rem 1.2rem}
.rhead{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;position:relative;overflow:hidden}
.rhead::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.rhead .eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.rhead h2{margin:.35rem 0 0;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.025em;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:#3a4258}
.pill.ok{background:#e6f6ec;border-color:#c7ebd4;color:#126b35}
.pill.warn{background:#fff4e5;border-color:#ffe0b3;color:var(--warn)}
.pill a{color:var(--brand-ink)}
.report{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;margin-top:22px}
@media(max-width:1060px){.report{grid-template-columns:1fr}.toc{position:static!important}}
.toc{position:sticky;top:84px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;color:#3a4258;font-size:13.5px;font-weight:500}
.toc a:hover{background:var(--brand-light);color:var(--brand-ink)}
.toc a b{font-size:11px;font-weight:800;color:var(--brand);min-width:20px}
.toc a.busy{opacity:.45}
.secs{display:flex;flex-direction:column;gap:16px;min-width:0}
section.s{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;scroll-margin-top:84px}
section.s>h3{display:flex;gap:12px;align-items:center;margin:0 0 14px;font-size:1.08rem;letter-spacing:-.01em}
section.s>h3 .n{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center;box-shadow:0 6px 14px rgba(59,91,253,.3);flex:none}
.body{font-size:15px;line-height:1.65;color:#2a3247;max-width:78ch}
.body h4{font-size:14px;font-weight:700;margin:16px 0 4px;color:var(--text)}
.body p{margin:0 0 10px}
.body ul{margin:0 0 10px;padding-left:20px}
.body strong{color:var(--text)}
.body a{color:var(--brand-ink);font-weight:600}
.body:has(.cal-wrap){max-width:none}
.tbl{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:12px}
.body table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.body th,.body td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
.body tr:last-child td{border-bottom:0}
.body th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.pending{color:var(--muted);font-size:14px}
.pending::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand2);margin-right:8px;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef1f8,#f7f9fd,#eef1f8);background-size:200% 100%;animation:sh 1.4s linear infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.pending::before,.skel{animation:none}}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-weight:600;transition:.15s}
.links a:hover{border-color:#c9d2ee;background:var(--brand-light);color:var(--brand-ink)}
.links a small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.links a .go-ic{color:var(--brand);font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;display:none;box-shadow:var(--shadow);z-index:50}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 78% -10%,#1b2a63 0,transparent 55%),linear-gradient(180deg,#0b1020,#0e1734)}
.gate .panel{width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.gate .brand{margin-bottom:18px}
.gate h2{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.gate p{color:var(--muted);margin:.4rem 0 0}
.menu-btn{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.menu-btn{display:inline-flex}.content{padding:18px}.topbar{padding:0 16px}.top-actions .lbl{display:none}}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:none;z-index:30}
.menu-pop.open{display:block}
.menu-pop button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.menu-pop button:hover{background:var(--brand-light);color:var(--brand-ink)}
.menu-pop small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.icon-btn{padding:.55rem .7rem!important}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-ink);box-shadow:0 1px 3px rgba(18,28,64,.12)}
section.s>h3 .seg{font-size:13px}
.cal-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cal{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.cal h5{margin:0 0 8px;font-size:13.5px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .dow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-grid .d{min-height:30px;border-radius:6px;font-size:11px;color:#6b7590;padding:3px 4px;background:var(--soft);position:relative}
.cal-grid .d.blank{background:none}
.cal-grid .d.on{color:#fff;font-weight:700}
.cal-grid .d.on.multi{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 4px,transparent 4px 8px)}
.legend{display:grid;gap:8px;margin-top:16px}
.lg{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.lg .sw{width:12px;height:12px;border-radius:4px;flex:none}
.lg .t{flex:1;min-width:0}
.lg .t b{display:block;font-size:14px}
.lg .t span{font-size:12.5px;color:var(--muted)}
.lg .v{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e6f6ec;color:#126b35;white-space:nowrap}
.lg .v.no{background:#fff4e5;color:var(--warn)}
.lg a.ics{font-size:12.5px;font-weight:600;color:var(--brand-ink);white-space:nowrap;cursor:pointer}
.cal-actions{display:flex;justify-content:flex-end;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(11,16,32,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);width:100%;max-width:520px;padding:24px;max-height:92vh;overflow:auto}
.modal h2{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:13.5px;margin-top:14px;cursor:pointer}
.check input{width:auto;margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.status.ok{background:#e6f6ec;color:#126b35}.status.no{background:#fff4e5;color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--brand-ink);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.side-foot button{border:0;background:none;color:inherit;cursor:pointer;font-size:12px;padding:0}
.side-foot button:hover{color:var(--brand-ink)}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const MARK='<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="icpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b5bfd"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#icpg)"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/><circle cx="32" cy="32" r="9.5" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3"/><circle cx="32" cy="32" r="3.6" fill="#fff"/><path d="M32 32 L49 15" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M44 14 h6 v6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SECTIONS=["Pitches creation","Problem identification","Ideal customer profiles","Market opportunity","Market entry justification","At a glance","Competition","Balanced scorecard","Tradeshow and conference opportunities","LinkedIn Sales Navigator","LinkedIn search links","Outreach email"];
const $=s=>document.querySelector(s);
let current=null, reports=[], busy=false, timer;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n");let out="",i=0;
  while(i<lines.length){const l=lines[i];
    if(/^\s*\|/.test(l)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter(r=>!/^\s*\|?[\s:\-|]+\|?\s*$/.test(r));
      if(body.length){out+='<div class="tbl"><table><thead><tr>'+cells(body[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+body.slice(1).map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"}continue}
    if(/^\s*[-*]\s+/.test(l)){out+="<ul>";while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){out+="<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>";i++}out+="</ul>";continue}
    if(/^#{1,4}\s/.test(l)){out+="<h4>"+inline(l.replace(/^#+\s*/,""))+"</h4>";i++;continue}
    if(!l.trim()){i++;continue}
    const para=[];while(i<lines.length&&lines[i].trim()&&!/^\s*(\||[-*]\s|#{1,4}\s)/.test(lines[i])){para.push(lines[i]);i++}
    out+="<p>"+para.map(inline).join("<br>")+"</p>";
  }return out}
function liUrl(k){
  return "https://www.linkedin.com/sales/search/people?query=(recentSearchParam%3A(doLogHistory%3Atrue)%2Ckeywords%3A"+encodeURIComponent(k)+"%2Cfilters%3AList((type%3ASENIORITY_LEVEL%2Cvalues%3AList((id%3A120%2Ctext%3ASenior%2CselectionType%3AINCLUDED)%2C(id%3A310%2Ctext%3ACXO%2CselectionType%3AINCLUDED)))%2C(type%3AREGION%2Cvalues%3AList((id%3A103644278%2Ctext%3AUnited%20States%2CselectionType%3AINCLUDED)))%2C(type%3ARELATIONSHIP%2Cvalues%3AList((id%3AS%2Ctext%3A2nd%20degree%20connections%2CselectionType%3AINCLUDED)))))&viewAllFilters=true"}
const fmtDate=(d,o)=>new Date(d).toLocaleDateString("en-US",o||{day:"numeric",month:"long",year:"numeric"});
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{"content-type":"application/json"},credentials:"same-origin"});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(d.error||("Error "+r.status)),{status:r.status});return d}
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display="none",4200)}

function shell(){
  $("#root").innerHTML=`<div class="app">
  <aside class="sidebar" id="side">
    <a class="brand" href="/">${MARK}<span>ICP<small>by Gershon.AI</small></span></a>
    <button class="btn btn-primary newbtn" id="newbtn">+ New analysis</button>
    <div class="nav-label">Reports</div>
    <ul class="hist" id="hist"><li class="hint">Loading…</li></ul>
    <div class="spacer"></div>
    <div class="side-foot"><a href="/">← Home</a><button id="setBtn">⚙ Settings</button><span id="ver"></span></div>
  </aside>
  <div>
    <div class="topbar"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="btn btn-ghost menu-btn" id="menu" aria-label="Menu">☰</button><h1 id="title">New analysis</h1></div><div class="top-actions" id="actions"></div></div>
    <main class="content" id="main"></main>
  </div></div>`;
  $("#newbtn").onclick=()=>{showNew();closeSide()};
  $("#menu").onclick=()=>$("#side").classList.toggle("open");
  $("#setBtn").onclick=()=>{closeSide();openSettings()};
}
const closeSide=()=>$("#side").classList.remove("open");
function setTop(title,actions){$("#title").textContent=title;$("#actions").innerHTML=actions||""}

function showNew(prefill={}){
  current=null;paintHist();setTop("New analysis");
  $("#main").innerHTML=`<div class="newgrid">
   <div class="panel">
     <h2 style="margin:0;font-size:1.25rem;letter-spacing:-.01em">Analyse a company</h2>
     <p class="hint" style="font-size:13.5px">ICP reads the website (home, about, product and technology pages) and writes the 12-point US market launch analysis.</p>
     <label for="url">Company website</label><input id="url" placeholder="https://company.com" autocomplete="off" value="${esc(prefill.url||"")}">
     <label for="name">Company name <span>(optional)</span></label><input id="name" placeholder="Leave empty to detect it" value="${esc(prefill.name||"")}">

const PALETTE=["#3b5bfd","#0ea5b7","#7c3aed","#e8590c","#16a34a","#db2777","#ca8a04","#475569"];
let settings=null, view9="list";
const ymd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(Date.UTC(a,b-1,c))};
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtRange(a,b){const A=ymd(a),B=ymd(b);const y1=A.getUTCFullYear(),m1=A.getUTCMonth(),d1=A.getUTCDate(),y2=B.getUTCFullYear(),m2=B.getUTCMonth(),d2=B.getUTCDate();
  if(a===b)return `${MS[m1]} ${d1}, ${y1}`;if(y1===y2&&m1===m2)return `${MS[m1]} ${d1}–${d2}, ${y1}`;if(y1===y2)return `${MS[m1]} ${d1} – ${MS[m2]} ${d2}, ${y1}`;return `${MS[m1]} ${d1}, ${y1} – ${MS[m2]} ${d2}, ${y2}`}
function calMonths(r){
  const ev=r.events||[];let s=r.windowStart,e=r.windowEnd;
  if(!s&&ev.length){s=ev[0].start;e=ev.reduce((m,x)=>x.end>m?x.end:m,ev[0].end)}
  if(!s)return[];const out=[];let d=ymd(s.slice(0,8)+"01");const end=ymd(e);
  while(d<=end&&out.length<12){out.push([d.getUTCFullYear(),d.getUTCMonth()]);d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1))}return out}
function calendarHtml(r){
  const ev=(r.events||[]).map((x,i)=>({...x,color:PALETTE[i%PALETTE.length]}));
  if(!ev.length)return '<p class="hint">This report has no dated events yet. Use Run again to get them.</p>';
  const months=calMonths(r).map(([y,m])=>{
    const first=new Date(Date.UTC(y,m,1)),days=new Date(Date.UTC(y,m+1,0)).getUTCDate(),lead=(first.getUTCDay()+6)%7;
    let cells=["M","T","W","T","F","S","S"].map(x=>`<div class="dow">${x}</div>`).join("")+'<div class="d blank"></div>'.repeat(lead);
    for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const hit=ev.filter(x=>iso>=x.start&&iso<=x.end);
      const title=hit.map(x=>x.name).join(" / ");
      cells+=hit.length?`<div class="d on${hit.length>1?" multi":""}" style="background-color:${hit[0].color}" title="${esc(title)}">${d}</div>`:`<div class="d">${d}</div>`}
    return `<div class="cal"><h5>${MON[m]} ${y}</h5><div class="cal-grid">${cells}</div></div>`}).join("");
  const legend=ev.map((x,i)=>`<div class="lg"><span class="sw" style="background:${x.color}"></span><div class="t"><b>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`:esc(x.name)}</b><span>${fmtRange(x.start,x.end)} · ${esc(x.location)} · ${x.score}/5</span></div><span class="v${x.verified?"":" no"}">${x.verified?"✓ Verified":"To confirm"}</span><a class="ics" data-i="${i}">+ Calendar</a></div>`).join("");
  return `<div class="cal-wrap">${months}</div><div class="legend">${legend}</div><div class="cal-actions"><button class="btn btn-ghost" id="icsAll">⬇ Add all to my calendar (.ics)</button></div>`;
}
function icsFor(list,company){
  const pad=n=>String(n).padStart(2,"0"),dt=s=>s.replace(/-/g,""),next=s=>{const d=ymd(s);d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)};
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const escI=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Gershon.AI//ICP//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:"+escI("US events — "+company),
    ...list.flatMap((e,i)=>["BEGIN:VEVENT","UID:"+dt(e.start)+"-"+i+"-"+(company||"icp").replace(/\W/g,"")+"@icp.gershon.ai","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+dt(e.start),"DTEND;VALUE=DATE:"+dt(next(e.end)),"SUMMARY:"+escI(e.name),"LOCATION:"+escI(e.location),"DESCRIPTION:"+escI(`Importance ${e.score}/5 for ${company}. ${e.verified?"Dates checked on the official website.":"Dates to confirm."} ${e.url||""}`),...(e.url?["URL:"+e.url]:[]),"END:VEVENT"]),
    "END:VCALENDAR"].join("\r\n");
}
function download(name,content,type){const b=content instanceof Blob?content:new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

}

  const m=modal(`<h2>Settings</h2><p style="margin:10px 0 0">Email: <span class="status ${s.emailReady?"ok":"no"}">${s.emailReady?"✓ Ready":"Not set up"}</span></p>
   ${s.keyFromSecret?'<p class="hint">The Resend key is set on the server.</p>':`<label for="skey">Resend API key <span>${s.emailReady?"(saved — paste a new one to replace it)":""}</span></label><input id="skey" type="password" placeholder="re_…" autocomplete="off"><p class="hint">Same Resend account as events.gershon.ai. The key is stored on the server and never shown again.</p>`}
   <label for="sname">Sender name</label><input id="sname" value="${esc(s.fromName||"ICP by Gershon.AI")}">
   <label for="sfrom">Sender address</label><input id="sfrom" value="${esc(s.fromEmail||"icp@gershon.ai")}">
   <label for="scc">Default CC</label><input id="scc" value="${esc(s.cc||"")}">
   <div class="err" id="serr"></div>
   <div class="row"><button class="btn btn-ghost" id="scancel">Close</button><button class="btn btn-primary" id="ssave">Save</button></div>`);
  $("#scancel").onclick=m.close;
  $("#ssave").onclick=async()=>{try{await api("/api/settings",{method:"POST",body:JSON.stringify({resendKey:$("#skey")?$("#skey").value:"",fromName:$("#sname").value,fromEmail:$("#sfrom").value,cc:$("#scc").value})});await getSettings();m.close();toast("Settings saved")}catch(e){$("#serr").textContent=e.message}};
}

start();

</script>
</body>
</html>
