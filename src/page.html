<style>
:root{
  /* Unified Gershon design (v1.5.0): Linalysis layout in Gershon.ai red */
  --bg:#1d1d1f; --bg2:#2a2a2d; --paper:#ffffff; --app:#f6f6f7;
  --text:#1d1d1f; --muted:#6b7280; --line:#e5e7eb; --soft:#f9fafb;
  --brand:#FE1B04; --brand2:#FE1B04; --brand-ink:#d11200; --brand-light:#fff5f5;
  --grad:linear-gradient(135deg,#FE1B04 0%,#d11200 100%);
  --ok:#16a34a; --warn:#b76b00; --err:#cc1016;
  --shadow:0 12px 32px rgba(29,29,31,.10); --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;font-size:.95rem;padding:.75rem 1.2rem;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.18s;white-space:nowrap;background:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(59,91,253,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(59,91,253,.45)}
.btn-primary:disabled{opacity:.6;transform:none;cursor:progress}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:#c8cfe6;background:var(--soft)}
.btn-ghost:disabled{opacity:.5;cursor:default}
.btn-lite{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.btn-lite:hover{background:rgba(255,255,255,.16)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
.brand small{display:block;font-weight:600;font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:-2px}
.mark{width:30px;height:30px;flex:none}

body{background:var(--app);font-size:14.5px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sidebar .brand{padding:4px 8px 16px}
.newbtn{width:100%;margin-bottom:8px}
.nav-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hist button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500;transition:background .15s,color .15s}
.hist button:hover{background:var(--brand-light);color:var(--brand-ink)}
.hist button[aria-current="true"]{background:var(--brand);color:#fff}
.hist button[aria-current="true"] small{color:#dfe5ff}
.hist small{color:var(--muted);font-size:12px;flex:none}
.hist .hint{padding:8px 10px}
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hist-head b{font-weight:600;color:var(--muted)}
.sortsw{display:inline-flex;border:1px solid var(--line,#e3e6ef);border-radius:999px;overflow:hidden;text-transform:none;letter-spacing:0}
.sortsw button{border:0;background:none;padding:3px 9px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.sortsw button[aria-pressed="true"]{background:var(--brand);color:#fff}
.hist-filter{width:100%;box-sizing:border-box;margin:0 0 6px;padding:7px 10px;border:1px solid var(--line,#e3e6ef);border-radius:9px;font:inherit;font-size:13px}
.hist .letter{font-size:11px;font-weight:700;color:var(--brand);padding:8px 10px 2px;list-style:none}
.spacer{flex:1}
.side-foot{border-top:1px solid var(--line);padding:12px 10px 4px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.side-foot a:hover{color:var(--brand-ink)}
.topbar{position:sticky;top:0;z-index:10;height:64px;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}
.topbar h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}
.top-actions .btn{padding:.55rem .95rem;font-size:.88rem;border-radius:10px}
.content{padding:28px;max-width:1180px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
label span{font-weight:400;color:var(--muted)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(59,91,253,.12)}
textarea{min-height:110px;resize:vertical}
.err{color:var(--err);font-size:13.5px;margin-top:10px}
.newgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px}
@media(max-width:980px){.newgrid{grid-template-columns:1fr}}
.hero-panel{background:radial-gradient(700px 300px at 90% -20%,#1b2a63 0,transparent 60%),linear-gradient(180deg,#0b1020,#0e1734);color:#eaf0ff;border:0}
.hero-panel h2{margin:0;font-size:1.6rem;letter-spacing:-.02em;color:#fff}
.hero-panel p{color:#c3ccea;margin:.5rem 0 0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.chip{display:flex;gap:10px;align-items:center;background:rgba(120,150,255,.1);border:1px solid rgba(140,165,255,.22);border-radius:10px;padding:8px 10px;font-size:.86rem;color:#dbe3ff}
.chip b{font-size:.75rem;color:var(--brand2);min-width:18px}
.go{width:100%;margin-top:20px;padding:.9rem 1.2rem}
.rhead{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;position:relative;overflow:hidden}
.rhead::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.rhead .eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.rhead h2{margin:.35rem 0 0;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.025em;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:#3a4258}
.pill.ok{background:#e6f6ec;border-color:#c7ebd4;color:#126b35}
.pill.warn{background:#fff4e5;border-color:#ffe0b3;color:var(--warn)}
.pill a{color:var(--brand-ink)}
.report{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;margin-top:22px}
@media(max-width:1060px){.report{grid-template-columns:1fr}.toc{position:static!important}}
.toc{position:sticky;top:84px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;color:#3a4258;font-size:13.5px;font-weight:500}
.toc a:hover{background:var(--brand-light);color:var(--brand-ink)}
.toc a b{font-size:11px;font-weight:800;color:var(--brand);min-width:20px}
.toc a.busy{opacity:.45}
.secs{display:flex;flex-direction:column;gap:16px;min-width:0}
section.s{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;scroll-margin-top:84px}
section.s>h3{display:flex;gap:12px;align-items:center;margin:0 0 14px;font-size:1.08rem;letter-spacing:-.01em}
section.s>h3 .n{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center;box-shadow:0 6px 14px rgba(59,91,253,.3);flex:none}
.body{font-size:15px;line-height:1.65;color:#2a3247;max-width:78ch}
.body h4{font-size:14px;font-weight:700;margin:16px 0 4px;color:var(--text)}
.body p{margin:0 0 10px}
.body ul{margin:0 0 10px;padding-left:20px}
.body strong{color:var(--text)}
.body a{color:var(--brand-ink);font-weight:600}
.body:has(.cal-wrap){max-width:none}
.tbl{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:12px}
.body table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.body th,.body td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
.body tr:last-child td{border-bottom:0}
.body th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.pending{color:var(--muted);font-size:14px}
.pending::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand2);margin-right:8px;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef1f8,#f7f9fd,#eef1f8);background-size:200% 100%;animation:sh 1.4s linear infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.pending::before,.skel{animation:none}}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-weight:600;transition:.15s}
.links a:hover{border-color:#c9d2ee;background:var(--brand-light);color:var(--brand-ink)}
.links a small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.links a .go-ic{color:var(--brand);font-size:1.1rem}
.sn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.sn-t{min-width:0;flex:1}.sn-t b{display:block;font-size:14.5px}.sn-t small{color:var(--muted);font-size:12.5px}
.sn-a{display:flex;gap:8px;flex-wrap:wrap}.sn-a .btn{padding:.5rem .85rem;font-size:.85rem;border-radius:10px}
.body .sn-a a.btn-primary{color:#fff}.body .sn-a a.btn-ghost{color:var(--text)}
.sn-raw{display:block;width:100%;font-size:10.5px;color:var(--muted);word-break:break-all;margin-top:6px;font-family:ui-monospace,Menlo,monospace}
.sn-h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.sn-note{border-left:3px solid #e0a100;background:rgba(224,161,0,.08);padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;display:none;box-shadow:var(--shadow);z-index:50}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 78% -10%,#1b2a63 0,transparent 55%),linear-gradient(180deg,#0b1020,#0e1734)}
.gate .panel{width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.gate .brand{margin-bottom:18px}
.gate h2{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.gate p{color:var(--muted);margin:.4rem 0 0}
.menu-btn{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.menu-btn{display:inline-flex}.content{padding:18px}.topbar{padding:0 16px}.top-actions .lbl{display:none}}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:none;z-index:30}
.menu-pop.open{display:block}
.menu-pop button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.menu-pop button:hover{background:var(--brand-light);color:var(--brand-ink)}
.menu-pop small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.icon-btn{padding:.55rem .7rem!important}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-ink);box-shadow:0 1px 3px rgba(18,28,64,.12)}
section.s>h3 .seg{font-size:13px}
.cal-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cal{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.cal h5{margin:0 0 8px;font-size:13.5px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .dow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-grid .d{min-height:30px;border-radius:6px;font-size:11px;color:#6b7590;padding:3px 4px;background:var(--soft);position:relative}
.cal-grid .d.blank{background:none}
.cal-grid .d.on{color:#fff;font-weight:700}
.cal-grid .d.on.multi{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 4px,transparent 4px 8px)}
.legend{display:grid;gap:8px;margin-top:16px}
.lg{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.lg .sw{width:12px;height:12px;border-radius:4px;flex:none}
.lg .t{flex:1;min-width:0}
.lg .t b{display:block;font-size:14px}
.lg .t span{font-size:12.5px;color:var(--muted)}
.lg .v{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e6f6ec;color:#126b35;white-space:nowrap}
.lg .v.no{background:#fff4e5;color:var(--warn)}
.lg a.ics{font-size:12.5px;font-weight:600;color:var(--brand-ink);white-space:nowrap;cursor:pointer}
.cal-actions{display:flex;justify-content:flex-end;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(11,16,32,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);width:100%;max-width:520px;padding:24px;max-height:92vh;overflow:auto}
.modal h2{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:13.5px;margin-top:14px;cursor:pointer}
.check input{width:auto;margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.status.ok{background:#e6f6ec;color:#126b35}.status.no{background:#fff4e5;color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--brand-ink);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.side-foot button{border:0;background:none;color:inherit;cursor:pointer;font-size:12px;padding:0}
.side-foot button:hover{color:var(--brand-ink)}
/* ===== Unified Gershon design v1.5.0 ===== */
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(29,29,31,.08)}
.btn-primary:hover{background:var(--brand-ink);transform:none;box-shadow:0 4px 12px rgba(254,27,4,.25)}
.btn-ghost:hover{border-color:#d1d5db;background:var(--soft)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input:focus,textarea:focus{border-color:var(--brand)!important;box-shadow:0 0 0 3px rgba(254,27,4,.15)!important}
.hist button{border-radius:999px;padding:8px 12px}
.hist button:hover{background:var(--brand-light);color:var(--brand-ink)}
.hist button[aria-current="true"]{background:var(--brand);color:#fff}
.hist button[aria-current="true"] small{color:#fde8e8}
.sidebar{border-right:1px solid var(--line)}
.panel,.rhead,section.s,.toc{border-radius:12px}
section.s>h3 .n{box-shadow:none;background:var(--brand)}
.step .n{box-shadow:none}
.hero-panel{background:var(--brand-light);color:var(--text);border:1px solid #f5d0d0}
.hero-panel h2{color:var(--text)}
.hero-panel p{color:var(--muted)}
.chip{background:#fff;border:1px solid var(--line);color:var(--text)}
.chip b{color:var(--brand)}
.gate{background:var(--app)}
.gate .panel{box-shadow:var(--shadow);border:1px solid var(--line)}
.toast{background:#1d1d1f}
.modal-bg{background:rgba(29,29,31,.45)}
.modal{border-radius:12px}
.links a:hover{border-color:#f5d0d0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:none}
.skel{background:linear-gradient(90deg,#f3f4f6,#fafafa,#f3f4f6);background-size:200% 100%}
.cal-grid .d{color:#6b7280}
/* v1.8.0: review sections before the PDF (edit, regenerate, approve) */
section.s>h3{flex-wrap:wrap}
.rv{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;font-size:13px;font-weight:600}
.seg+.rv{margin-left:6px}
.rv .btn{padding:.4rem .7rem;font-size:.82rem;border-radius:9px}
.rv .btn-ok{background:#fff;border-color:#c7ebd4;color:#126b35}
.rv .btn-ok:hover{background:#e6f6ec}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.ok{background:#e6f6ec;border-color:#c7ebd4;color:#126b35}
.st.ed{background:#fff4e5;border-color:#ffe0b3;color:var(--warn)}
.review-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:13.5px}
.review-bar .bar{flex:1 1 140px;height:6px;border-radius:999px;background:#e5e7eb;overflow:hidden;min-width:100px}
.review-bar .bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.review-bar.done .bar i{background:var(--ok)}
.ed{display:grid;gap:10px;max-width:none}
.ed .seg{margin-left:0;justify-self:start}
.ed textarea{min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55}
.ed .pv{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;min-height:120px}
.ed-ai{display:flex;gap:8px;flex-wrap:wrap}
.ed-ai input{flex:1 1 220px;width:auto}
.ed-ai .btn,.ed-row .btn{padding:.6rem 1rem;font-size:.88rem;border-radius:10px}
.ed-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.ed-row .hint{margin:0 auto 0 0}
.ed.working{opacity:.65;pointer-events:none}
.gate-list{margin:12px 0 0;padding-left:18px;font-size:13.5px;color:#3a4258}
.gate-list li{margin:2px 0}
@media(max-width:860px){.rv{margin-left:0;width:100%}.seg+.rv{margin-left:0}}
/* phone: no sideways scroll, compact top bar, menu button */
html,body{max-width:100%;overflow-x:hidden}

<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const MARK='<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="icpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FE1B04"/><stop offset=".5" stop-color="#FE1B04"/><stop offset="1" stop-color="#d11200"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#icpg)"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/><circle cx="32" cy="32" r="9.5" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3"/><circle cx="32" cy="32" r="3.6" fill="#fff"/><path d="M32 32 L49 15" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M44 14 h6 v6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// v1.9.0: keys are stable storage ids, ORDER is the displayed 01-12 order (same list as src/index.js).
const TITLES={1:"Pitches creation",2:"Problem identification",3:"Ideal customer profiles",4:"Market opportunity",13:"Market size: TAM, SAM, SOM",5:"Market entry justification",6:"At a glance",7:"Competition",10:"LinkedIn Sales Navigator",11:"LinkedIn search links",14:"Dedicated LinkedIn groups",15:"Sample outreach emails"};
const ORDER=[1,2,3,4,13,5,6,7,10,11,14,15];
const SECTIONS=ORDER.map(k=>TITLES[k]);
const num=k=>String(ORDER.indexOf(k)+1).padStart(2,"0");
// Section 14: one LinkedIn group search per group (always valid, unlike guessed group URLs).
const grpUrl=g=>"https://www.linkedin.com/search/results/groups/?keywords="+encodeURIComponent(String(g.keywords||g.name).split(",")[0].trim());
function groupsHtml(r,doc){const g=r.groups||[];if(!g.length)return "";
  if(doc)return '<p style="margin:12px 0 6px;font-weight:700">Find these groups on LinkedIn</p>'+g.map(x=>`<p style="margin:0 0 6px"><a href="${grpUrl(x)}" target="_blank">${esc(x.name)}</a> <span style="color:#6b7280;font-size:12px">— search: ${esc(x.keywords)}</span></p>`).join("");
  return '<div class="sn-h">Find these groups on LinkedIn</div><div class="links">'+g.map(x=>`<a href="${grpUrl(x)}" target="_blank" rel="noopener"><span>${esc(x.name)}<small>LinkedIn group search: ${esc(x.keywords)}</small></span><span class="go-ic">↗</span></a>`).join("")+'</div>'}
const $=s=>document.querySelector(s);
let current=null, reports=[], busy=false, timer;
let histSort="recent";try{histSort=localStorage.getItem("icp:sort")==="az"?"az":"recent"}catch(e){}
function setSort(v){histSort=v;try{localStorage.setItem("icp:sort",v)}catch(e){}paintHist()}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n");let out="",i=0;
  while(i<lines.length){const l=lines[i];
    if(/^\s*\|/.test(l)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter(r=>!/^\s*\|?[\s:\-|]+\|?\s*$/.test(r));
      if(body.length){out+='<div class="tbl"><table><thead><tr>'+cells(body[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+body.slice(1).map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"}continue}
    if(/^\s*[-*]\s+/.test(l)){out+="<ul>";while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){out+="<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>";i++}out+="</ul>";continue}
    if(/^#{1,4}\s/.test(l)){out+="<h4>"+inline(l.replace(/^#+\s*/,""))+"</h4>";i++;continue}
    if(!l.trim()){i++;continue}
    const para=[];while(i<lines.length&&lines[i].trim()&&!/^\s*(\||[-*]\s|#{1,4}\s)/.test(lines[i])){para.push(lines[i]);i++}
    out+="<p>"+para.map(inline).join("<br>")+"</p>";
  }return out}
// Sales Navigator people search. Structure and IDs verified live in Sales Navigator on 2026-10-28
// (every chip rendered: Current job title, Owner / Partner, CXO, Vice President, Director, United States, 2nd degree).
// Titles go in the CURRENT_TITLE filter (free text, no ID needed); industry terms go in keywords, joined with OR.
// The query is Rest.li: values are percent-encoded once inside the query, then the whole query is URL-encoded.
const SN_SEN=[[320,"Owner / Partner"],[310,"CXO"],[300,"Vice President"],[220,"Director"]];
const SN_VERIFIED="United States · Owner/Partner, CXO, VP, Director · current job title";
function restli(v){return encodeURIComponent(v).replace(/[()'!*]/g,c=>"%"+c.charCodeAt(0).toString(16).toUpperCase())}
const SN_STOP=new Set("a an and the of for in on at to with or by & head director directors vp vice president chief officer manager managers lead leader ceo coo cfo cto cio cso cmo founder founders co-founder owner partner senior principal svp evp executive".split(" "));
function snTerms(k){
  let parts=String(k||"").split(/\s*[,;|]\s*/).map(x=>x.replace(/["*]/g,"").trim()).filter(Boolean);
  // Older reports stored one long phrase ("spatial biology core facility director"): LinkedIn reads that as AND of every word.
  if(parts.length===1&&parts[0].split(/\s+/).length>3)parts=parts[0].split(/\s+/).filter(w=>!SN_STOP.has(w.toLowerCase()));
  return [...new Set(parts.map(x=>x.toLowerCase()))].slice(0,6);
}
const snOr=list=>list.map(x=>/\s/.test(x)?`"${x}"`:x).join(" OR ");
function snUrl(x,warm){
  const v=(id,t)=>`(${id!=null?"id:"+id+",":""}text:${restli(t)},selectionType:INCLUDED)`;
  const f=[`(type:SENIORITY_LEVEL,values:List(${SN_SEN.map(a=>v(a[0],a[1])).join(",")}))`,`(type:REGION,values:List(${v(103644278,"United States")}))`];
  if((x.titles||[]).length)f.push(`(type:CURRENT_TITLE,values:List(${x.titles.slice(0,8).map(t=>v(null,t)).join(",")}))`);
  if(warm)f.push(`(type:RELATIONSHIP,values:List(${v("S","2nd degree connections")}))`);
  const kw=snOr(x.terms||[]);
  const q="(recentSearchParam:(doLogHistory:true),filters:List("+f.join(",")+")"+(kw?",keywords:"+restli(kw):"")+")";
  return "https://www.linkedin.com/sales/search/people?query="+encodeURIComponent(q)+"&viewAllFilters=true";
}
const PERSONAS=[
 {label:"CEO / Founder",titles:["CEO","Chief Executive Officer","Founder","President","Managing Director"]},
 {label:"COO / Operations",titles:["COO","Chief Operating Officer","VP Operations","Head of Operations","Director of Operations"]},
 {label:"VP / Director (Business Development)",titles:["VP Business Development","Director of Business Development","Head of Partnerships","Chief Commercial Officer","VP Sales"]},
 {label:"Procurement",titles:["Chief Procurement Officer","VP Procurement","Head of Procurement","Purchasing Director","Sourcing Director"]},
 {label:"Technology",titles:["CTO","Chief Technology Officer","CIO","VP Engineering","Head of R&D"]},
 {label:"CFO / Finance",titles:["CFO","Chief Financial Officer","VP Finance","Finance Director"]}];
// Titles per segment come from section 10 ("### Segment" then "Titles: a, b, c").
function snSection10(r){const out=[];let cur=null;for(const l of String((r.sections||{})[10]||"").split("\n")){const h=l.match(/^\s*#{2,4}\s*(.+)/);if(h){cur={label:h[1].replace(/\*/g,"").trim(),titles:[]};out.push(cur);continue}
  const t=l.match(/^\s*[-*]?\s*\**Titles?\**\s*:\**\s*(.+)/i);if(t&&cur)cur.titles=t[1].replace(/\*/g,"").split(/\s*[,;]\s*/).map(x=>x.trim()).filter(Boolean)}return out}
// Persona searches: the lead term of each segment, max 4 (tested: 8 OR terms returned 59K loose matches, 3-4 lead terms ~1K on-target).
function snIndustryTerms(r){const all=[];for(const s of r.searches||[]){const t=snTerms(s.keywords)[0];if(t)all.push(t)}return [...new Set(all)].slice(0,4)}
function snSegments(r){const s10=snSection10(r),norm=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,"");
  return (r.searches||[]).map((s,i)=>{const m=s10.find(x=>norm(x.label)===norm(s.label))||s10[i]||{titles:[]};return {label:s.label,titles:m.titles.slice(0,6),terms:snTerms(s.keywords)}})}
function snPersonas(r){const terms=snIndustryTerms(r);return PERSONAS.map(p=>({label:p.label,titles:p.titles,terms}))}
function icpIndustries(r){const t=String((r.sections||{})[3]||"").split("\n").filter(l=>/^\s*\|/.test(l));if(t.length<3)return[];
  const cells=l=>l.split("|").slice(1,-1).map(c=>c.replace(/\*/g,"").trim());const h=cells(t[0]).map(x=>x.toLowerCase());const i=h.findIndex(x=>x.includes("industry"));if(i<0)return[];
  return t.slice(2).map(l=>cells(l)[i]).filter(Boolean).slice(0,6)}
function snMapping(r){const ind=icpIndustries(r);return[
 ["Geography","USA","REGION","In link: United States"],
 ["Seniority","Owner/Partner, CXO, VP, Director","SENIORITY_LEVEL","In link"],
 ["Role / title","Per persona and segment","CURRENT_TITLE","In link"],
 ["Industry",ind.join(", ")||"See ICP table","Keywords (OR)","In link as keywords (INDUSTRY IDs not verified)"],
 ["Warm connections","2nd degree","RELATIONSHIP","Second button on each row"],
 ["Company size","Per ICP","COMPANY_HEADCOUNT","Apply manually"],
 ["Exclusions","Competitors, recruiters, consultants, students","EXCLUDED","Apply manually"]]}
function snManualNote(r){return "Optional, apply in Sales Navigator after opening a link: Company headcount (per ICP) and exclusions (competitors, recruiters, consultants, students). Everything else is already in the link."}
const snDesc=x=>(x.titles.length?"Titles: "+x.titles.join(", "):"")+(x.terms.length?(x.titles.length?" · ":"")+"Keywords: "+snOr(x.terms):"");
function snRow(x,kind,i){const u=snUrl(x);return `<div class="sn"><div class="sn-t"><b>${esc(x.label)}</b><small>${esc(snDesc(x))}</small></div><div class="sn-a"><a class="btn btn-primary" href="${u}" target="_blank" rel="noopener">Open in Sales Navigator ↗</a><a class="btn btn-ghost" href="${snUrl(x,true)}" target="_blank" rel="noopener" title="Same search, 2nd-degree connections only">2nd° only ↗</a><button class="btn btn-ghost sn-copy" data-k="${kind}" data-i="${i}" title="Copy the Sales Navigator link">⧉</button></div><span class="sn-raw">${esc(u)}</span></div>`}
function snMapTable(r){return '<div class="tbl"><table><thead><tr><th>ICP</th><th>Value</th><th>Sales Navigator filter</th><th>Status</th></tr></thead><tbody>'+snMapping(r).map(a=>"<tr>"+a.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"}
// Customized GPT USA introduction — word for word as Aina sends it (ImaageQ email, 2026-10-02).
const GPT_INTRO=`<p>Hi [First Name],</p><p>Ahead of your meeting with Olivier Attia, we'd like to share a tool we've been developing internally to support companies exploring expansion into the US market.</p><p>The content below was generated using our proprietary GPT for US Market Expansion. We invite you to test it and explore some of the insights it can provide regarding your company and potential US market opportunities.</p><p>The direct link is:<br><a href="https://bit.ly/GPTUSA">https://bit.ly/GPTUSA</a></p><p>This GPT, called USA Market Launch, can only be used with GPT-4. You must have access to the GPTs section in the top left corner of chat.openai.com to use it.</p><p>We use ChatGPT extensively across our US market development campaigns and are now building dedicated GPTs for our clients and their specific growth initiatives.</p><p>The content below has been prepared specifically for your company. We would greatly appreciate your feedback, either by email or during your discussion with Olivier, as it will help us continue improving the tool.</p>`;
const fmtDate=(d,o)=>new Date(d).toLocaleDateString("en-US",o||{day:"numeric",month:"long",year:"numeric"});
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{"content-type":"application/json"},credentials:"same-origin"});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(d.error||("Error "+r.status)),{status:r.status});return d}
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display="none",4200)}

function shell(){
  $("#root").innerHTML=`<div class="app">
  <aside class="sidebar" id="side">
    <a class="brand" href="/">${MARK}<span>ICP<small>by Gershon.AI</small></span></a>
    <button class="btn btn-primary newbtn" id="newbtn">+ New analysis</button>
    <div class="nav-label hist-head"><span>Reports <b id="histCount"></b></span><span class="sortsw" role="group" aria-label="Sort reports"><button id="sortRecent" type="button">Recent</button><button id="sortAz" type="button">A–Z</button></span></div>
    <input class="hist-filter" id="histFilter" type="search" placeholder="Search reports…" aria-label="Search reports">
    <ul class="hist" id="hist"><li class="hint">Loading…</li></ul>
    <div class="spacer"></div>
    <div class="side-foot"><a href="/">← Home</a><button id="setBtn">⚙ Settings</button><span id="ver"></span></div>
  </aside>
  <div>
    <div class="topbar"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="btn btn-ghost menu-btn" id="menu" aria-label="Menu">☰</button><h1 id="title">New analysis</h1></div><div class="top-actions" id="actions"></div></div>
    <main class="content" id="main"></main>
  </div></div>`;
  $("#newbtn").onclick=()=>{if(anyDirty()&&!confirmDiscard())return;showNew();closeSide()};
  $("#sortRecent").onclick=()=>setSort("recent");$("#sortAz").onclick=()=>setSort("az");$("#histFilter").oninput=()=>paintHist();
  $("#menu").onclick=()=>$("#side").classList.toggle("open");
  $("#setBtn").onclick=()=>{closeSide();openSettings()};
}
const closeSide=()=>$("#side").classList.remove("open");
function setTop(title,actions){$("#title").textContent=title;$("#actions").innerHTML=actions||""}

function showNew(prefill={}){
  for(const k of Object.keys(editing))delete editing[k];
  current=null;paintHist();setTop("New analysis");
  $("#main").innerHTML=`<div class="newgrid">
   <div class="panel">
     <h2 style="margin:0;font-size:1.25rem;letter-spacing:-.01em">Analyse a company</h2>
     <p class="hint" style="font-size:13.5px">ICP reads the website (home, about, product and technology pages) and writes the 12-point US market launch analysis.</p>
     <label for="url">Company website</label><input id="url" placeholder="https://company.com" autocomplete="off" value="${esc(prefill.url||"")}">
     <label for="name">Company name <span>(optional)</span></label><input id="name" placeholder="Leave empty to detect it" value="${esc(prefill.name||"")}">
     <label for="ctx">What you know about them <span>(optional)</span></label><textarea id="ctx" placeholder="Call notes, deck summary, or the website text if the site blocks automated reading…"></textarea>
     <p class="hint">Notes you paste here take priority over the website.</p>
     <button class="btn btn-primary go" id="go">Run the 12-point analysis</button>
     <div class="err" id="err" role="alert"></div>
   </div>
   <div class="panel hero-panel">
     <h2>What you get</h2><p>The same 12 sections as the USA Market Launch GPT, saved for the whole team.</p>
     <div class="chips">${ORDER.map(k=>`<div class="chip"><b>${num(k)}</b>${esc(TITLES[k])}</div>`).join("")}</div>
   </div></div>`;
  $("#go").onclick=run;$("#url").addEventListener("keydown",e=>{if(e.key==="Enter")run()});$("#url").focus();
}

const SKEL='<div class="skel" style="width:92%"></div><div class="skel" style="width:78%"></div><div class="skel" style="width:85%"></div>';
function secHtml(r,n,isBusy){const t=TITLES[n];let b;
  if(n===11){const P=snPersonas(r),S=snSegments(r);b='<p>Every link opens Sales Navigator with these filters already applied: '+SN_VERIFIED+'. One search per persona and one per ICP segment. Use “2nd° only” for warm introductions.</p><div class="sn-h">ICP → filter mapping</div>'+snMapTable(r)+'<div class="sn-h">Persona searches</div><div class="links">'+P.map((x,i)=>snRow(x,"p",i)).join("")+'</div><div class="sn-h">ICP segment searches</div>'+(S.length?'<div class="links">'+S.map((x,i)=>snRow(x,"s",i)).join("")+"</div>":(isBusy?SKEL:'<p class="hint">No segment searches.</p>'))+'<div class="sn-note">'+esc(snManualNote(r))+'</div>'}
  else b=r.sections[n]?md(r.sections[n])+(n===14?groupsHtml(r):""):(isBusy?SKEL:'<p class="hint">Not generated yet — use ↻ Regenerate to write this section.</p>');
  return `<section class="s" id="s${n}"><h3><span class="n">${num(n)}</span>${esc(t)}${isBusy||!r.slug?"":secControls(r,n)}</h3><div class="body">${b}</div></section>`}
function rbarHtml(r,isBusy){if(isBusy||!r.slug)return "";const c=reviewCount(r),all=c.done===c.total;
  return `<div class="review-bar${all?" done":""}" id="reviewBar"><span>${all?"✓ All sections approved — ready for the PDF":"Review before the PDF: <b>"+c.done+" of "+c.total+"</b> sections approved"}</span><span class="bar"><i style="width:${Math.round(100*c.done/c.total)}%"></i></span>${all?"":'<button class="btn btn-ghost" id="nextReview" style="padding:.4rem .8rem;font-size:.82rem;border-radius:9px">Next to review →</button>'}</div>`}
function bindSnCopy(){document.querySelectorAll(".sn-copy").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(snUrl((b.dataset.k==="p"?snPersonas(current):snSegments(current))[+b.dataset.i]));toast("Sales Navigator link copied")}catch(e){toast("Copy blocked by the browser")}})}
function render(r,isBusy){
  for(const k of Object.keys(editing))delete editing[k];
  current=r;paintHist();
  setTop(r.company,isBusy?"":`<button class="btn btn-ghost icon-btn" id="rerun" title="Run again">↻</button><button class="btn btn-ghost" id="copyEmail" title="Copy the prospect email">⧉ <span class="lbl">Copy</span></button><div class="menu" id="dlMenu"><button class="btn btn-ghost" id="dlBtn" aria-haspopup="true">⬇ <span class="lbl">Download</span></button><div class="menu-pop" id="dlPop"><button data-k="pdf">📄<span>PDF<small>Formatted report, A4</small></span></button><button data-k="html">🌐<span>HTML<small>Opens in any browser</small></span></button></div></div><button class="btn btn-primary" id="sendBtn">✉ <span class="lbl">Send by email</span></button>`);
  const src=r.source;
  const pills=[`<span class="pill"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\//,"").replace(/\/$/,""))}</a></span>`,
    `<span class="pill">📅 ${fmtDate(r.createdAt)}</span>`,
    src?(src.siteRead?`<span class="pill ok">✓ Website read (${(src.pages||[]).length} pages)</span>`:`<span class="pill warn">Website not readable — based on notes and general knowledge</span>`):""].join("");
  const toc=ORDER.map(k=>`<li><a href="#s${k}" class="${isBusy&&!r.sections[k]&&k!==11?"busy":""}"><b>${num(k)}</b>${esc(TITLES[k])}</a></li>`).join("");
  const secs=ORDER.map(k=>secHtml(r,k,isBusy)).join("");
  const rbar=rbarHtml(r,isBusy);
  $("#main").innerHTML=`<div class="rhead"><div class="eyebrow">USA Market Launch · 12-point analysis</div><h2>${esc(r.company)}</h2><div class="meta">${pills}</div>${rbar}${isBusy?'<p class="pending" style="margin:14px 0 0">Reading the website and writing the analysis — about a minute.</p>':""}</div>
  <div class="report"><nav class="toc" aria-label="Sections"><ol>${toc}</ol></nav><div class="secs">${secs}</div></div>`;
  bindSnCopy();
  if(!isBusy){$("#copyEmail").onclick=()=>copyEmail(current);$("#rerun").onclick=()=>showNew({url:r.url,name:r.company});bindReportActions(r);bindReview(r)}
}
function emailHtml(r){
  const intro=GPT_INTRO;
  return intro+ORDER.map((n,i)=>{const c=n===11?snHtml(r):md(r.sections[n])+(n===14?groupsHtml(r,true):"");return `<h3>${i+1}. ${esc(TITLES[n])}</h3>${c}`}).join("");
}
async function copyEmail(r){
  const subject="Customized GPT USA by Gershon Consulting for "+r.company;const html=emailHtml(r);
  try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([subject+"\n\n"+html.replace(/<[^>]+>/g,"\n").replace(/\n{3,}/g,"\n\n")],{type:"text/plain"})})]);toast("Copied — subject: "+subject)}
  catch(e){toast("Copy blocked by the browser — select the report text instead")}
}
function paintHist(){
  const h=$("#hist");if(!h)return;
  const az=histSort==="az";
  [["#sortRecent",!az],["#sortAz",az]].forEach(([s,on])=>{const b=$(s);if(b)b.setAttribute("aria-pressed",String(on))});
  const c=$("#histCount");if(c)c.textContent=reports.length?"("+reports.length+")":"";
  if(!reports.length){h.innerHTML='<li class="hint">No reports yet.</li>';return}
  const q=(($("#histFilter")||{}).value||"").trim().toLowerCase();
  let list=reports.filter(r=>!q||(r.company+" "+r.url).toLowerCase().includes(q));
  if(az)list=list.slice().sort((a,b)=>String(a.company||"").localeCompare(String(b.company||""),"en",{sensitivity:"base",numeric:true}));
  if(!list.length){h.innerHTML='<li class="hint">No match.</li>';return}
  let last="";
  h.innerHTML=list.map(r=>{let pre="";if(az){const L=(String(r.company||"#").trim()[0]||"#").toUpperCase();const k=/[A-Z]/.test(L)?L:"#";if(k!==last){pre=`<li class="letter">${k}</li>`;last=k}}
    return pre+`<li><button data-id="${esc(r.slug)}" aria-current="${!!(current&&current.slug===r.slug)}" title="${esc(r.url||"")}"><span>${esc(r.company)}</span><small>${fmtDate(r.createdAt,{month:"short",day:"numeric"})}</small></button></li>`}).join("");
  h.querySelectorAll("button").forEach(b=>b.onclick=()=>{openReport(b.dataset.id);closeSide()});
}
async function loadList(){try{reports=(await api("/api/reports")).reports}catch(e){reports=[]}paintHist()}
function anyDirty(){return Object.keys(editing).some(n=>isDirty(+n))}
async function openReport(id){if(anyDirty()&&!confirmDiscard())return;try{render(await api("/api/reports/"+id),false);history.replaceState(null,"","/app#"+id)}catch(e){toast(e.message)}}
async function run(){
  if(busy)return;$("#err").textContent="";
  let url=$("#url").value.trim();if(!url){$("#err").textContent="Enter the company website first.";$("#url").focus();return}
  if(!/^https?:\/\//.test(url))url="https://"+url;
  const name=$("#name").value.trim(),notes=$("#ctx").value.trim();
  busy=true;$("#go").disabled=true;$("#go").textContent="Analysing…";
  const stub={slug:"",url,company:name||url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/.*$/,""),createdAt:new Date().toISOString(),window:"",sections:{},searches:[]};
  try{const p=api("/api/analyze",{method:"POST",body:JSON.stringify({url,name,notes})});render(stub,true);
    const r=await p;render(r,false);await loadList();history.replaceState(null,"","/app#"+r.slug);
    if(r.errors&&r.errors.length)toast(r.errors.join(". ")+". Use Run again to fill the gaps.");else toast("Report saved");}
  catch(e){if(e.status===401)return gate("no");showNew({url,name});$("#ctx").value=notes;$("#err").textContent=e.message}
  finally{busy=false}
}
function gate(state){
  const setup=state==="setup";
  $("#root").innerHTML=`<div class="gate"><div class="panel"><a class="brand" href="/">${MARK}<span>ICP<small>by Gershon.AI</small></span></a>
  <h2>${setup?"Choose the team password":"Sign in"}</h2><p>${setup?"First visit: pick a password of at least 8 characters to share with the Gershon team.":"Enter the Gershon team password."}</p>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="${setup?"new-password":"current-password"}">
  <button class="btn btn-primary go" id="pwgo">${setup?"Set password and open ICP":"Sign in"}</button><div class="err" id="pwerr"></div></div></div>`;
  const go=async()=>{try{await api(setup?"/api/setup":"/api/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})});start()}catch(e){$("#pwerr").textContent=e.message}};
  $("#pwgo").onclick=go;$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});$("#pw").focus();
}
async function start(){
  let s;try{s=await api("/api/session")}catch(e){s={state:"no"}}
  if(s.state!=="ok")return gate(s.state);
  shell();$("#ver").textContent="v"+(s.version||"");
  await loadList();
  const want=location.hash.slice(1);
  if(want&&reports.some(r=>r.slug===want))openReport(want);else if(reports.length)openReport(reports[0].slug);else showNew();
}
// ===== v1.2: downloads, email, settings =====
let settings=null;
function download(name,content,type){const b=content instanceof Blob?content:new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const fileBase=r=>(r.company||"report").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"")+"-ICP-"+(r.createdAt||"").slice(0,10);

function snHtml(r){const row=x=>`<p style="margin:0 0 10px"><b>${esc(x.label)}</b> — ${esc(snDesc(x))}<br><a href="${snUrl(x)}" target="_blank">Open in Sales Navigator</a> · <a href="${snUrl(x,true)}" target="_blank">2nd-degree connections only</a><br><span style="font-size:10.5px;color:#6b7280;word-break:break-all">${esc(snUrl(x))}</span></p>`;const td='style="border:1px solid #e5e7eb;padding:6px 8px;font-size:12.5px"';return '<p style="margin:0 0 8px">Filters in every link: '+SN_VERIFIED+'.</p><p style="margin:12px 0 6px;font-weight:700">ICP → filter mapping</p><table style="border-collapse:collapse;width:100%;margin-bottom:12px">'+snMapping(r).map(a=>"<tr>"+a.map(c=>`<td ${td}>${esc(c)}</td>`).join("")+"</tr>").join("")+'</table><p style="margin:12px 0 6px;font-weight:700">Persona searches</p>'+snPersonas(r).map(row).join("")+'<p style="margin:12px 0 6px;font-weight:700">ICP segment searches</p>'+snSegments(r).map(row).join("")+'<p style="margin:10px 0;padding:8px 10px;background:#fff7e0;border-left:3px solid #e0a100;font-size:12.5px">'+esc(snManualNote(r))+'</p>'}
// Standalone, printable report document (used for HTML download, PDF and the email attachment)
function docBody(r,intro,pdf){
  const tbl='style="border-collapse:collapse;width:100%;font-size:13px;margin:8px 0 14px"';
  const fix=h=>h.replace(/<div class="tbl"><table>/g,`<table ${tbl}>`).replace(/<\/table><\/div>/g,"</table>").replace(/<th>/g,'<th style="text-align:left;background:#f9fafb;border:1px solid #e5e7eb;padding:7px 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280">').replace(/<td>/g,'<td style="border:1px solid #e5e7eb;padding:7px 9px;vertical-align:top">');
  const head=`<div style="border-radius:14px;padding:22px 24px;background:#FE1B04;background-image:linear-gradient(135deg,#FE1B04,#d11200);color:#fff;margin-bottom:18px"><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff5f5;font-weight:700">USA Market Launch · 12-point analysis</div><div style="font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px">${esc(r.company)}</div><div style="font-size:13px;color:#fde8e8;margin-top:6px">${esc(r.url)} · ${fmtDate(r.createdAt)}</div></div>`;
  const introHtml=intro?`<div style="font-size:14px;line-height:1.6;margin-bottom:18px">${GPT_INTRO}</div>`:"";
  const secs=ORDER.map(n=>{const t=TITLES[n];let c=n===11?snHtml(r):fix(md(r.sections[n]))+(n===14?groupsHtml(r,true):"");
    return `<div data-sec style="page-break-inside:avoid;break-inside:avoid;border:1px solid #e5e7eb;border-radius:12px;padding:16px 18px;margin:0 0 12px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="display:inline-block;min-width:28px;height:28px;line-height:28px;text-align:center;border-radius:8px;background:#FE1B04;color:#fff;font-weight:800;font-size:12px">${num(n)}</span><b style="font-size:16px">${esc(t)}</b></div><div style="font-size:13.5px;line-height:1.6;color:#2a3247">${c}</div></div>`}).join("");
  return `<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;${pdf?"":"max-width:820px;margin:0 auto"}">${introHtml}${head}${secs}<div style="font-size:11.5px;color:#6b7280;margin-top:16px;text-align:center">Prepared by Gershon Consulting · icp.gershon.ai</div></div>`;
}
function docHtml(r,intro){return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(r.company)} — US market launch analysis</title><style>body{margin:0;padding:28px 18px;background:#fff}a{color:#d11200}@media print{body{padding:0}}</style></head><body>${docBody(r,intro)}</body></html>`}
let pdfLib;
function loadPdfLib(){return pdfLib||(pdfLib=new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";s.onload=()=>ok(window.html2pdf);s.onerror=()=>{pdfLib=null;ko(new Error("Could not load the PDF tool"))};document.head.appendChild(s)}))}
async function downloadPdf(r){
  toast("Preparing the PDF…");
  try{const h2p=await loadPdfLib();
    await h2p().set({margin:[10,10,12,10],filename:fileBase(r)+".pdf",image:{type:"jpeg",quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",scrollX:0,scrollY:0},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:"div[data-sec]"}}).from(docBody(r,false,true),"string").save();
    toast("PDF downloaded")}catch(e){toast("PDF failed: "+e.message)}
}
function bindReportActions(r){
  const dm=$("#dlMenu"),pop=$("#dlPop");
  if(dm){$("#dlBtn").onclick=e=>{e.stopPropagation();pop.classList.toggle("open")};document.addEventListener("click",()=>pop.classList.remove("open"),{once:true});
    pop.querySelectorAll("button").forEach(b=>b.onclick=()=>{pop.classList.remove("open");const k=b.dataset.k;
      if(k==="pdf")reviewGate(current,"PDF",()=>downloadPdf(current));
      if(k==="html")reviewGate(current,"HTML file",()=>{download(fileBase(current)+".html",docHtml(current,false),"text/html");toast("HTML downloaded")});
})}
  if($("#sendBtn"))$("#sendBtn").onclick=()=>reviewGate(current,"email",()=>openSend(current));
}
function modal(html){const bg=document.createElement("div");bg.className="modal-bg";bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(bg);
  const close=()=>bg.remove();bg.addEventListener("click",e=>{if(e.target===bg)close()});document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});return{bg,close}}
async function getSettings(){try{settings=await api("/api/settings")}catch(e){settings=settings||{emailReady:false}}return settings}
async function openSend(r){
  const s=await getSettings();
  const subj="Customized GPT USA by Gershon Consulting for "+r.company;
  const m=modal(`<h2>Send by email</h2><p class="hint" style="font-size:13px">The full 12-point report goes in the email body, with the HTML version attached.</p>
   ${s.emailReady?"":`<p style="margin:12px 0 0"><span class="status no">Email not set up</span> <button class="linkbtn" id="toSettings">Open Settings</button></p>`}
   <label for="mto">To</label><input id="mto" placeholder="name@company.com, other@company.com">
   <label for="mcc">CC</label><input id="mcc" value="${esc(s.cc||"")}">
   <label for="msub">Subject</label><input id="msub" value="${esc(subj)}">
   <label class="check"><input type="checkbox" id="mintro" checked> <span>Start with the Customized GPT USA introduction for prospects (Ahead of your meeting with Olivier Attia…)</span></label>
   <div class="err" id="merr"></div>
   <div class="row"><button class="btn btn-ghost" id="mcopy">Copy instead</button><button class="btn btn-ghost" id="mcancel">Cancel</button><button class="btn btn-primary" id="msend" ${s.emailReady?"":"disabled"}>Send</button></div>`);
  $("#mto").focus();$("#mcancel").onclick=m.close;
  $("#mcopy").onclick=()=>{copyEmail(r);m.close()};
  if($("#toSettings"))$("#toSettings").onclick=()=>{m.close();openSettings()};
  $("#msend").onclick=async()=>{const b=$("#msend");b.disabled=true;b.textContent="Sending…";$("#merr").textContent="";
    const toList=$("#mto").value;try{const intro=$("#mintro").checked;await api(`/api/reports/${r.slug}/email`,{method:"POST",body:JSON.stringify({to:$("#mto").value,cc:$("#mcc").value,subject:$("#msub").value,html:docBody(r,intro),docHtml:docHtml(r,false)})});m.close();toast("Email sent to "+toList)}
    catch(e){$("#merr").textContent=e.message;b.disabled=false;b.textContent="Send"}};
}
async function openSettings(){
  const s=await getSettings();
  const m=modal(`<h2>Settings</h2><p style="margin:10px 0 0">Email: <span class="status ${s.emailReady?"ok":"no"}">${s.emailReady?"✓ Ready":"Not set up"}</span></p>
   ${s.keyFromSecret?'<p class="hint">The Resend key is set on the server.</p>':`<label for="skey">Resend API key <span>${s.emailReady?"(saved — paste a new one to replace it)":""}</span></label><input id="skey" type="password" placeholder="re_…" autocomplete="off"><p class="hint">Same Resend account as events.gershon.ai. The key is stored on the server and never shown again.</p>`}
   <label for="sname">Sender name</label><input id="sname" value="${esc(s.fromName||"ICP by Gershon.AI")}">
   <label for="sfrom">Sender address</label><input id="sfrom" value="${esc(s.fromEmail||"icp@gershon.ai")}">
   <label for="scc">Default CC</label><input id="scc" value="${esc(s.cc||"")}">
   <div class="err" id="serr"></div>
   <div class="row"><button class="btn btn-ghost" id="scancel">Close</button><button class="btn btn-primary" id="ssave">Save</button></div>`);
  $("#scancel").onclick=m.close;
  $("#ssave").onclick=async()=>{try{await api("/api/settings",{method:"POST",body:JSON.stringify({resendKey:$("#skey")?$("#skey").value:"",fromName:$("#sname").value,fromEmail:$("#sfrom").value,cc:$("#scc").value})});await getSettings();m.close();toast("Settings saved")}catch(e){$("#serr").textContent=e.message}};
}

// ===== v1.8.0: review each AI section (edit, regenerate, approve) before the PDF =====
// Section 11 is built from sections 3 and 10, so it has no editor of its own.
const EDITABLE=ORDER.filter(k=>k!==11);
const editing={};
function reviewCount(r){const rv=(r&&r.review)||{};return{done:EDITABLE.filter(n=>rv[n]&&rv[n].approved).length,total:EDITABLE.length}}
function stateChip(r,n){const v=((r.review||{})[n])||{};
  if(v.approved)return `<span class="st ok" title="Approved ${esc(fmtDate(v.at))}">✓ ${v.edited?"Edited · approved":"Approved"}</span>`;
  return v.edited?'<span class="st ed">Edited · not approved</span>':'<span class="st">AI draft</span>'}
function secControls(r,n){
  if(n===11)return '<span class="rv"><span class="st" title="Rebuilt automatically from sections ${num(3)} and ${num(10)}">Built from ${num(3)} + ${num(10)}</span></span>';
  if(!EDITABLE.includes(n))return "";
  const ok=((r.review||{})[n]||{}).approved;
  return `<span class="rv" data-n="${n}">${stateChip(r,n)}<button class="btn btn-ghost" data-act="edit" title="Edit this section">✎ Edit</button><button class="btn btn-ghost" data-act="regen" title="Write this section again with the AI">↻ Regenerate</button>${ok||!String((r.sections||{})[n]||"").trim()?"":'<button class="btn btn-ok" data-act="approve" title="Approve as it is">✓ Approve</button>'}</span>`}
function bindReview(r){
  document.querySelectorAll(".rv[data-n]").forEach(box=>{const n=+box.dataset.n;
    box.querySelectorAll("button").forEach(b=>b.onclick=()=>{const a=b.dataset.act;
      if(a==="edit")openEditor(n,false);
      if(a==="regen")openEditor(n,true);
      if(a==="approve")saveSection(n,{approve:true})})});
  if($("#nextReview"))$("#nextReview").onclick=()=>{const n=firstUnapproved(current);if(n)$("#s"+n).scrollIntoView({behavior:"smooth",block:"start"})};
}
function firstUnapproved(r){return EDITABLE.find(n=>!(((r.review||{})[n])||{}).approved)}
function isDirty(n){const e=editing[n];return !!e&&(e.text!==String(current.sections[n]||"")||!!e.extra)}
function openEditor(n,regen){
  const r=current;if(!r||editing[n])return regen&&editing[n]?regenSection(n):void 0;
  editing[n]={text:String(r.sections[n]||""),extra:null,view:"write"};
  const sec=$("#s"+n),box=sec.querySelector(".body");
  sec.querySelector(".rv").style.display="none";
  box.innerHTML=`<div class="ed" id="ed${n}">
    <span class="seg"><button data-v="write" aria-pressed="true">Write</button><button data-v="preview" aria-pressed="false">Preview</button></span>
    <textarea aria-label="Section ${num(n)} text" spellcheck="true"></textarea>
    <div class="pv body" hidden></div>
    <div class="ed-ai"><input placeholder="Optional instruction for the AI — e.g. shorter, focus on hospitals, more formal" aria-label="Instruction for the AI" maxlength="600"><button class="btn btn-ghost" data-act="regen">↻ Regenerate with AI</button></div>
    <div class="ed-row"><span class="hint">${n===14?"The LinkedIn search links under the table are refreshed when you regenerate. ":""}Markdown: **bold**, “- ” bullets, “| a | b |” tables.</span><button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="save">✓ Save &amp; approve</button></div>
  </div>`;
  const ed=$("#ed"+n),ta=ed.querySelector("textarea");
  ta.value=editing[n].text;ta.style.height=Math.min(640,Math.max(260,ta.scrollHeight+12))+"px";
  ta.oninput=()=>{editing[n].text=ta.value};
  ed.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const pv=b.dataset.v==="preview";editing[n].view=b.dataset.v;
    ed.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    ta.hidden=pv;const p=ed.querySelector(".pv");p.hidden=!pv;if(pv)p.innerHTML=md(ta.value)||'<p class="hint">Empty</p>'});
  ed.querySelector('[data-act="regen"]').onclick=()=>regenSection(n);
  ed.querySelector('[data-act="cancel"]').onclick=()=>{if(isDirty(n)&&!confirmDiscard())return;closeEditor(n)};
  ed.querySelector('[data-act="save"]').onclick=()=>{const t=ta.value.trim();if(!t)return toast("The section cannot be empty");const body={text:t,approve:true};if(editing[n].extra)Object.assign(body,editing[n].extra);saveSection(n,body)};
  ed.querySelector(".ed-ai input").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();regenSection(n)}});
  sec.scrollIntoView({behavior:"smooth",block:"start"});
  if(regen)regenSection(n);else ta.focus();
}
function confirmDiscard(){return window.confirm("Discard your changes to this section?")}
function closeEditor(n){delete editing[n];refreshSection(n)}
// Re-draws one section (and what depends on it) without closing other open editors.
function refreshSection(n){
  const swap=k=>{const el=$("#s"+k);if(!el||editing[k])return;el.outerHTML=secHtml(current,k,false)};
  swap(n);if(n===3||n===10)swap(11);
  const rb=$("#reviewBar");if(rb)rb.outerHTML=rbarHtml(current,false);
  bindReview(current);bindSnCopy();
}
async function regenSection(n){
  const ed=$("#ed"+n);if(!ed)return;const ta=ed.querySelector("textarea"),ins=ed.querySelector(".ed-ai input"),btn=ed.querySelector('[data-act="regen"]');
  const old=btn.textContent;ed.classList.add("working");btn.textContent="Writing a new version…";
  try{const d=await api(`/api/reports/${current.slug}/sections/${n}/regenerate`,{method:"POST",body:JSON.stringify({instruction:ins.value.trim()})});
    if(!$("#ed"+n))return;
    ta.value=d.text;editing[n].text=d.text;editing[n].extra=(d.searches||d.groups)?{searches:d.searches,groups:d.groups}:null;
    const pv=ed.querySelector(".pv");if(!pv.hidden)pv.innerHTML=md(d.text);
    toast("New version ready — check it, then Save & approve")}
  catch(e){if(e.status===401)return gate("no");toast("Regenerate failed: "+e.message)}
  finally{const e2=$("#ed"+n);if(e2){e2.classList.remove("working");btn.textContent=old}}
}
async function saveSection(n,body){
  const ed=$("#ed"+n);if(ed)ed.classList.add("working");
  try{const d=await api(`/api/reports/${current.slug}/sections/${n}`,{method:"PUT",body:JSON.stringify(body)});
    current=d.report;delete editing[n];refreshSection(n);
    toast(d.review.done===d.review.total?"All sections approved — ready for the PDF":"Section approved ("+d.review.done+" of "+d.review.total+")")}
  catch(e){if(ed)ed.classList.remove("working");if(e.status===401)return gate("no");toast("Save failed: "+e.message)}
}
// Before a PDF, HTML file or email: make sure open edits are saved and say which sections are not approved yet.
function reviewGate(r,label,go){
  const open=Object.keys(editing).map(Number).filter(n=>isDirty(n));
  if(open.length){toast("Save or cancel your edit of section "+num(open[0])+" first");$("#s"+open[0]).scrollIntoView({behavior:"smooth",block:"start"});return}
  const left=EDITABLE.filter(n=>!(((r.review||{})[n])||{}).approved);
  if(!left.length)return go();
  const m=modal(`<h2>${left.length} section${left.length>1?"s":""} not approved yet</h2>
    <p class="hint" style="font-size:13.5px">The ${esc(label)} uses the text as it is now. You can review these sections first, or continue with the AI draft.</p>
    <ul class="gate-list">${left.map(n=>`<li><b>${num(n)}</b> ${esc(TITLES[n])}</li>`).join("")}</ul>
    <div class="row"><button class="btn btn-ghost" id="gAnyway">Create ${esc(label)} anyway</button><button class="btn btn-primary" id="gReview">Review first</button></div>`);
  $("#gReview").onclick=()=>{m.close();$("#s"+left[0]).scrollIntoView({behavior:"smooth",block:"start"})};
  $("#gAnyway").onclick=()=>{m.close();go()};
}
window.addEventListener("beforeunload",e=>{if(anyDirty()){e.preventDefault();e.returnValue=""}});

start();

</script>
